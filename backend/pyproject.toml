[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kervcodes", email = "kervintz84@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi[all]>=0.148.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
