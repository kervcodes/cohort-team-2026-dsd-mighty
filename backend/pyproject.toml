[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kervcodes", email = "kervintz84@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.148.0",
    "pydantic>=2.14.1",
    "supabase>=2.33.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
